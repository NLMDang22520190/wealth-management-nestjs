services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: wealth_management_demo
      POSTGRES_USER: wms_demo
      POSTGRES_PASSWORD: wms_demo_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_demo -d wealth_management_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  demo_postgres:
